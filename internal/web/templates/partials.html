{{define "styles"}}<style>
  /* Light theme (default) — closer to MikroTik's own look. */
  :root{
    --bg:#f4f6f8;--card:#ffffff;--fg:#1b2733;--muted:#6b7682;--line:#dfe4ea;
    --accent:#2b6cb0;--accent-fg:#ffffff;--ok:#2f8a3b;--warn:#b9770d;--err:#c0392b;--header:#ffffff;
  }
  /* System dark: when the OS is dark and the user hasn't forced light. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1115;--card:#1a1d24;--fg:#e6e8ea;--muted:#9aa4b2;--line:#2a2f3a;
      --accent:#4c8bf5;--accent-fg:#ffffff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--header:#1a1d24;
    }
  }
  /* Forced dark. */
  :root[data-theme="dark"]{
    --bg:#0f1115;--card:#1a1d24;--fg:#e6e8ea;--muted:#9aa4b2;--line:#2a2f3a;
    --accent:#4c8bf5;--accent-fg:#ffffff;--ok:#3fb950;--warn:#d29922;--err:#f85149;--header:#1a1d24;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;padding-bottom:52px}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--header);border-bottom:1px solid var(--line)}
  header .brand{font-weight:700;letter-spacing:.5px;color:var(--accent)}
  header .sp{flex:1}
  main{max-width:1000px;margin:24px auto;padding:0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  input,button,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
  button,.btn{background:var(--accent);border:none;color:var(--accent-fg);cursor:pointer;border-radius:8px;padding:8px 12px;display:inline-block}
  button.secondary,.btn.secondary{background:transparent;color:var(--fg);border:1px solid var(--line)}
  label{display:block;margin:10px 0 4px;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .muted{color:var(--muted)} .ok{color:var(--ok)} .err{color:var(--err)}
  .flash{padding:10px 12px;border-radius:8px;margin-bottom:14px}
  .flash.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);border:1px solid var(--ok)}
  .flash.err{background:color-mix(in srgb,var(--err) 14%,transparent);border:1px solid var(--err)}
  pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;overflow:auto;max-height:70vh}
  .pill{font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
  .badge{background:var(--err);color:#fff;border-radius:999px;padding:0 7px;font-size:12px;font-weight:700}
  .sev-crit{color:var(--err);font-weight:600} .sev-warn{color:var(--warn);font-weight:600}
  .st-active{color:var(--err)} .st-resolved{color:var(--ok)}
  footer.appfoot{position:fixed;left:0;bottom:0;display:flex;align-items:center;gap:10px;
    padding:6px 12px;background:var(--header);border-top:1px solid var(--line);border-right:1px solid var(--line);
    border-top-right-radius:10px;font-size:12px;color:var(--muted);z-index:50}
  footer.appfoot select{padding:3px 6px;font-size:12px}
  footer.appfoot .ver{opacity:.8}
</style>
<script>
  // Apply the saved theme before paint to avoid a flash.
  (function(){try{var t=localStorage.getItem("rosman-theme")||"system";
    document.documentElement.setAttribute("data-theme",t);}catch(e){}})();
</script>{{end}}

{{define "nav"}}<header>
  <span class="brand" title="Router Operation System Manager">ROSMan</span>
  <a href="/">Устройства</a>
  <a href="/alerts">Алерты{{if gt (alertCount) 0}} <span class="badge">{{alertCount}}</span>{{end}}</a>
  <a href="/audit">Аудит</a>
  {{if canWrite .}}<a href="/devices/new">+ Добавить</a>{{end}}
  <span class="sp"></span>
  <span class="muted">{{.Username}} ({{.Role}})</span>
  <form method="post" action="/logout" style="margin:0"><button class="secondary" type="submit">Выход</button></form>
</header>{{end}}

{{define "footer"}}<footer class="appfoot">
  <select id="langSel" title="Язык">
    <option value="ru">RU</option>
    <option value="en">EN</option>
  </select>
  <select id="themeSel" title="Тема">
    <option value="system">Системная</option>
    <option value="light">Светлая</option>
    <option value="dark">Тёмная</option>
  </select>
  <span class="ver">ROSMan v{{version}}</span>
</footer>
<script>
  (function(){
    var th=document.getElementById("themeSel"), ln=document.getElementById("langSel");
    try{th.value=localStorage.getItem("rosman-theme")||"system";}catch(e){}
    th.addEventListener("change",function(){
      try{localStorage.setItem("rosman-theme",th.value);}catch(e){}
      document.documentElement.setAttribute("data-theme",th.value);
    });
    try{ln.value=localStorage.getItem("rosman-lang")||"ru";}catch(e){}
    ln.addEventListener("change",function(){
      try{localStorage.setItem("rosman-lang",ln.value);
        document.cookie="rosman-lang="+ln.value+";path=/;max-age=31536000";}catch(e){}
      location.reload();
    });
  })();
</script>{{end}}
