{{define "map"}}{{template "head" .}}
<link rel="stylesheet" href="/static/leaflet/leaflet.css">
<div class="cardhead"><h1 style="margin:0">{{t "map.title"}}</h1></div>
{{if .SiteN}}
<div class="card" style="padding:0;overflow:hidden">
  <div id="map" style="height:70vh;min-height:360px;width:100%;border-radius:10px"></div>
</div>
<p class="muted small">{{t "map.legend"}}</p>
<script src="/static/leaflet/leaflet.js"></script>
<script>
(function(){
  var sites = {{.MapData}};
  var map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  var pts = [];
  sites.forEach(function(s){
    var color = s.total===0 ? '#888' : (s.online===s.total ? '#22c55e' : (s.online===0 ? '#ef4444' : '#f59e0b'));
    var m = L.circleMarker([s.lat, s.lon], {radius:9, color:'#0008', weight:1, fillColor:color, fillOpacity:0.9}).addTo(map);
    var list = s.devices.map(function(d){ return (d.up? '🟢 ':'🔴 ') + d.name; }).join('<br>') || '—';
    m.bindPopup('<b>'+s.name+'</b><br>'+s.online+'/'+s.total+' online<br>'+list);
    pts.push([s.lat, s.lon]);
  });
  if (pts.length === 1) { map.setView(pts[0], 13); }
  else if (pts.length > 1) { map.fitBounds(pts, {padding:[40,40]}); }
  else { map.setView([20,0], 2); }
})();
</script>
{{else}}
<div class="card"><p class="muted">{{t "map.none"}}</p></div>
{{end}}
{{template "tail" .}}{{end}}
