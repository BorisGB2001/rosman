{{define "config"}}{{template "head" .}}
<div class="cardhead"><h1 style="margin:0">{{t "cfg.title"}} #{{.C.ID}} <span class="badge">{{.C.Kind}}</span></h1><span class="muted">{{ts .C.TakenAt}}</span></div>
<div class="card">
  <p class="mono muted">sha256: {{.C.SHA256}}</p>
  <pre class="http">{{.C.Content}}</pre>
</div>
<p><a href="/devices/{{.C.DeviceID}}">← {{t "cfg.back"}}</a></p>
{{template "tail" .}}{{end}}
