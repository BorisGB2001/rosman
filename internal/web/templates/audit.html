{{define "audit"}}{{template "head" .}}
<div class="cardhead"><h1 style="margin:0">{{t "au.title"}}</h1></div>
<div class="card">
  <div class="scroll"><table class="dtable">
    <thead><tr><th>{{t "au.time"}}</th><th>{{t "au.user"}}</th><th>{{t "au.action"}}</th><th>{{t "al.detail"}}</th></tr></thead>
    <tbody>
    {{range .Rows}}
      <tr><td class="muted">{{ts .TS}}</td><td>{{.Actor}}</td><td class="mono">{{.Action}}</td><td class="muted">{{.Detail}}</td></tr>
    {{else}}
      <tr><td colspan="4" class="muted">{{t "au.empty"}}</td></tr>
    {{end}}
    </tbody>
  </table></div>
</div>
{{template "tail" .}}{{end}}
