{{define "new_device"}}{{template "head" .}}
<div class="cardhead"><h1 style="margin:0">{{t "newdev.title"}}</h1>
  <a class="btn sm secondary" href="/devices/import">{{t "imp.title"}}</a></div>
<div class="card narrow">
  <p class="muted">{{t "newdev.desc"}}</p>
  {{if .Err}}<div class="note err">{{.Err}}</div>{{end}}
  <form method="post" action="/devices/new" style="display:flex;flex-direction:column;gap:10px">
    <label>{{t "newdev.name"}}<input name="name" value="{{.Name}}"></label>
    <label>{{t "newdev.ip"}}<input name="ip" value="{{.IP}}" required></label>
    <label>{{t "newdev.port"}}<input name="api_port" value="8729"></label>
    <label>{{t "newdev.apiuser"}}<input name="api_user" value="{{.APIUser}}" required></label>
    <label>{{t "newdev.apipass"}}<input name="api_pass" type="password"></label>
    <label>{{t "newdev.sshuser"}}<input name="ssh_user"></label>
    {{if .CatModels}}
    <label>{{t "newdev.template"}}
      <select id="cattpl" onchange="applyTpl()">
        <option value="">{{t "newdev.template_none"}}</option>
        {{range .CatModels}}<option value="{{.Notes}}">{{.VendorName}} · {{.Name}}</option>{{end}}
      </select>
    </label>
    <span class="muted small">{{t "newdev.template_note"}}</span>
    {{end}}
    <label>{{t "img.notes"}}<textarea id="devnotes" name="notes" rows="3" placeholder="{{t "img.notes_ph"}}"></textarea></label>
    <label style="flex-direction:row;gap:8px;align-items:flex-start"><input type="checkbox" name="setup_tls" style="margin-top:3px"> <span>{{t "newdev.setup_tls"}}<br><span class="muted small">{{t "newdev.setup_tls_note"}}</span></span></label>
    <fieldset style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:0">
      <legend class="muted small" style="padding:0 6px">{{t "newdev.bootstrap"}}</legend>
      <p class="muted small" style="margin:0 0 8px">{{t "newdev.bootstrap_note"}}</p>
      <label>{{t "newdev.boot_user"}}<input name="boot_user" autocomplete="off" placeholder="admin"></label>
      <label style="margin-top:8px">{{t "newdev.boot_pass"}}<input name="boot_pass" type="password" autocomplete="new-password"></label>
    </fieldset>
    <div class="badges" style="margin-top:6px">
      <button class="btn primary" type="submit">{{t "common.add"}}</button>
      <a class="btn" href="/">{{t "common.cancel"}}</a>
    </div>
  </form>
</div>
<script>
function applyTpl(){
  var sel=document.getElementById('cattpl'), notes=document.getElementById('devnotes');
  if(!sel||!notes) return;
  var v=sel.value;
  // fill only when empty or still holding a previous template, to avoid clobbering typing
  if(v && (!notes.value.trim() || notes.dataset.fromTpl==='1')){ notes.value=v; notes.dataset.fromTpl='1'; }
  else if(!v && notes.dataset.fromTpl==='1'){ notes.value=''; notes.dataset.fromTpl=''; }
}
</script>
{{template "tail" .}}{{end}}
