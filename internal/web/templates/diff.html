{{define "diff"}}{{template "head" .}}
<div class="cardhead"><h1 style="margin:0">{{t "diff.title"}} — {{.D.Name}}</h1></div>
<div class="card narrow">
  <form class="inline" method="get" action="/devices/{{.D.ID}}/diff" style="gap:8px;flex-wrap:wrap">
    <select name="a">{{range .Configs}}<option value="{{.ID}}" {{if eq .ID $.A}}selected{{end}}>{{ts .TakenAt}}</option>{{end}}</select>
    <span>→</span>
    <select name="b">{{range .Configs}}<option value="{{.ID}}" {{if eq .ID $.B}}selected{{end}}>{{ts .TakenAt}}</option>{{end}}</select>
    <button class="btn sm primary" type="submit">{{t "diff.compare"}}</button>
  </form>
</div>
{{if .Lines}}
<div class="card">
  <p class="muted small"><span style="color:var(--good)">+{{.Added}}</span> / <span style="color:var(--bad)">−{{.Removed}}</span></p>
  <pre class="http" style="font-size:12px;line-height:1.4">{{range .Lines}}{{if eq .Op "+"}}<span style="background:color-mix(in srgb,var(--good) 20%,transparent);display:block">+ {{.Text}}</span>{{else if eq .Op "-"}}<span style="background:color-mix(in srgb,var(--bad) 20%,transparent);display:block">− {{.Text}}</span>{{else}}<span style="display:block">  {{.Text}}</span>{{end}}{{end}}</pre>
</div>
{{end}}
<p><a href="/devices/{{.D.ID}}">← {{t "dev.back"}}</a></p>
{{template "tail" .}}{{end}}
